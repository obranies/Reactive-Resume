name: Build, Push and Deploy Docker Image

on:
  push:
    branches: [custom]

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine build metadata
        id: build-meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/obranies/reactive-resume:custom
          build-args: |
            APP_BUILD_SHA=${{ steps.build-meta.outputs.sha }}
            APP_BUILD_TIME=${{ steps.build-meta.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Reactive Resume
        timeout-minutes: 7
        env:
          PORTAINER_DEPLOY_TOKEN: ${{ secrets.PORTAINER_DEPLOY_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 360 \
            -X POST \
            -H "Authorization: Bearer ${PORTAINER_DEPLOY_TOKEN}" \
            https://portainer-api.branies.net/deploy/reactive-resume

          echo
